name: Deploy Telegram bot worker

on:
  push:
    branches: [main]
    paths:
      - "tools/telegram-bot/**"
      - ".github/workflows/deploy-telegram-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/telegram-bot
          command: deploy
          wranglerVersion: "4.134.0"

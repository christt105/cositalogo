name: Deploy Cositálogo API worker

on:
  push:
    branches: [main]
    paths:
      - "tools/cositalogo-api/src/**"
      - "tools/cositalogo-api/migrations/**"
      - "tools/cositalogo-api/wrangler.toml"
      - "scripts/validation.js"
      - "site/rules.js"
      - ".github/workflows/deploy-cositalogo-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cositalogo-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/cositalogo-api
          wranglerVersion: "4.134.0"
          command: d1 migrations apply cositalogo --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/cositalogo-api
          wranglerVersion: "4.134.0"
          command: deploy

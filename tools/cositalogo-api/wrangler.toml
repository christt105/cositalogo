name = "cositalogo"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[vars]
BOT_USERNAME = "CositalogoBot"

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "cositalogo"
database_id = "e94251c9-969a-4ffc-bf03-b12c4aabda43"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/assets/*"]
